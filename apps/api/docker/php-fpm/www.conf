[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Only reachable by the Nginx in the same container.
listen = 127.0.0.1:9000

; Render Free: 512 MB of RAM and a small Supabase pooler; each worker holds at most one DB connection.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 60s

; Laravel logs to stderr (LOG_CHANNEL=stderr); forward it to the container output as is.
catch_workers_output = yes
decorate_workers_output = no

; Workers read the configuration cached by `php artisan optimize` at start-up, not the environment.
clear_env = yes
